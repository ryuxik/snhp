<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640"><rect width="1600" height="640" fill="#1a1a19"/><text x="96" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#97958c" letter-spacing="2.5">MOLT SEASON</text><text x="96" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="160" font-weight="700" fill="#d95926" letter-spacing="-5">+$44,065</text><text x="96" y="348" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="42" fill="#f2ede1">what asking for a raise is worth if you hold an offer</text><text x="96" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="42" fill="#f2ede1">and are expensive to replace</text><line x1="1000" y1="140" x2="1000" y2="290" stroke="#3f3e39" stroke-width="2"/><text x="1048" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#97958c">just sign it</text><text x="1504" y="190" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#97958c">$7,446</text><text x="1048" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#f2ede1">ask</text><text x="1504" y="262" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#f2ede1">$51,511</text><line x1="96" y1="496" x2="1504" y2="496" stroke="#3f3e39" stroke-width="2"/><text x="96" y="542" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#97958c">Even with no outside offer at all, it is worth $5,729.</text><text x="96" y="584" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#97958c">Ten thousand simulated crabs. Thirty-nine pre-registered kills.</text></svg>
