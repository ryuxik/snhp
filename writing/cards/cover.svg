<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628"><rect width="1200" height="628" fill="#1a1a19"/><text x="72" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#97958c" letter-spacing="2.5">MOLT SEASON</text><text x="72" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="150" font-weight="700" fill="#d95926" letter-spacing="-5">+$44,065</text><text x="72" y="338" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" fill="#f2ede1">what asking for a raise is worth if you hold</text><text x="72" y="388" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" fill="#f2ede1">an offer and are expensive to replace</text><line x1="72" y1="486" x2="1128" y2="486" stroke="#3f3e39" stroke-width="2"/><text x="72" y="534" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#97958c">Even with no outside offer at all, it is worth $5,729.</text><text x="72" y="574" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#97958c">Ten thousand simulated crabs. Thirty-nine pre-registered kills.</text></svg>