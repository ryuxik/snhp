<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628"><rect width="1200" height="628" fill="#1a1a19"/><text x="72" y="86" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="600" fill="#f2ede1">Why nobody offers you a menu</text><text x="72" y="126" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" fill="#97958c">Employer payoff across two seasons, if you remember what you were shown.</text><text x="72" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#f2ede1">one package, no menu</text><rect x="644.78791239257" y="212" width="475.21208760743" height="30" rx="4" fill="#3987e5"/><text x="1134" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" fill="#97958c">-$48,974</text><text x="72" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#f2ede1">a menu, forgotten each year</text><rect x="622.4896035486554" y="290" width="497.5103964513446" height="30" rx="4" fill="#3987e5"/><text x="1134" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" fill="#97958c">-$51,272</text><text x="72" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#f2ede1">a menu, and you remember</text><rect x="560.0" y="368" width="560.0" height="30" rx="4" fill="#e66767"/><text x="1134" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" fill="#97958c">-$57,712</text><line x1="72" y1="452" x2="1128" y2="452" stroke="#3f3e39" stroke-width="2"/><text x="72" y="506" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#f2ede1">They are paying $8,738 a head to stop you learning</text><text x="72" y="550" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#f2ede1">how much room they have.</text></svg>