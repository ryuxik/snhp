<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628"><rect width="1200" height="628" fill="#1a1a19"/><text x="72" y="86" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="600" fill="#f2ede1">What asking is worth, against not asking</text><text x="72" y="126" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" fill="#97958c">Three-year value of the package agreed. 600 crab-seasons, five pre-registered seeds.</text><rect x="72" y="152" width="13" height="13" fill="#3987e5"/><text x="95" y="164" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#97958c">just sign it</text><rect x="220" y="152" width="13" height="13" fill="#d95926"/><text x="243" y="164" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#97958c">ask</text><text x="72" y="220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#f2ede1">everyone</text><text x="72" y="248" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#d95926">+$13,529</text><rect x="452" y="202" width="79.61639261516957" height="19" rx="4" fill="#3987e5"/><rect x="452" y="226" width="247.70786822232145" height="19" rx="4" fill="#d95926"/><text x="729.7078682223214" y="241" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#97958c">$19,937</text><text x="72" y="316" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#f2ede1">you hold an offer</text><text x="72" y="344" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#d95926">+$33,744</text><rect x="452" y="298" width="103.95604822270971" height="19" rx="4" fill="#3987e5"/><rect x="452" y="322" width="523.2094115819922" height="19" rx="4" fill="#d95926"/><text x="1005.2094115819922" y="337" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#97958c">$42,111</text><text x="72" y="412" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#f2ede1">an offer, and hard to replace</text><text x="72" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#d95926">+$44,065</text><rect x="452" y="394" width="92.5130554638815" height="19" rx="4" fill="#3987e5"/><rect x="452" y="418" width="640.0" height="19" rx="4" fill="#d95926"/><text x="1122.0" y="433" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#97958c">$51,511</text><text x="72" y="508" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#f2ede1">no offer at all</text><text x="72" y="536" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#d95926">+$5,729</text><rect x="452" y="490" width="76.89542039564365" height="19" rx="4" fill="#3987e5"/><rect x="452" y="514" width="148.07555667721456" height="19" rx="4" fill="#d95926"/><text x="630.0755566772145" y="529" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#97958c">$11,918</text><text x="72" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#97958c">Your leverage is what it costs to replace you.</text></svg>